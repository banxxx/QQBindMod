plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}


version = "${mod_version}-forge-${forge_minecraft_version}"
group = mod_group_id

sourceSets {
    main {
        java {
            srcDirs 'src/main/java', '../common-src/src/main/java', '../common-native-src/src/main/java'
        }
        resources {
            srcDirs 'src/main/resources', '../common-native-src/src/main/resources'
        }
    }
}

// Use ForgeGradle's public mapping tasks directly. No extra MixinGradle plugin
// is needed to produce the refmap and the inherited/Shadow member mappings.
def officialMixinMappings = tasks.register('createOfficialMixinMappings', net.minecraftforge.gradle.mcp.tasks.GenerateSRG) {
    srg.set(tasks.named('extractSrg', net.minecraftforge.gradle.common.tasks.ExtractMCPData).flatMap { it.output })
    mappings.set(minecraft.mappings)
    reverse = true
    setFormat('SRG')
}
def officialRefmap = layout.buildDirectory.file('generated/official-mixin/qqbind-official.refmap.json')
def officialExtraMappings = layout.buildDirectory.file('generated/official-mixin/qqbind-official-extra.srg')
tasks.named('compileJava', JavaCompile) {
    dependsOn officialMixinMappings
    inputs.file(officialMixinMappings.flatMap { it.output })
    outputs.file(officialRefmap)
    outputs.file(officialExtraMappings)
    doFirst {
        officialRefmap.get().asFile.parentFile.mkdirs()
        options.compilerArgs += [
            '-AreobfSrgFile=' + officialMixinMappings.get().output.get().asFile.absolutePath,
            '-AoutRefMapFile=' + officialRefmap.get().asFile.absolutePath,
            '-AoutSrgFile=' + officialExtraMappings.get().asFile.absolutePath,
            '-AdefaultObfuscationEnv=searge'
        ]
    }
}
tasks.withType(Jar).configureEach {
    if (name == 'jar' || name == 'jarJar') from(officialRefmap)
}
tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    if (name == 'reobfJar' || name == 'reobfJarJar') extraMappings.from(officialExtraMappings)
}

base {
    archivesName = mod_id
}

minecraft {
    mappings channel: 'official', version: project.forge_minecraft_version
    runs {
        server {
            workingDirectory project.file('run')
            mods {
                qqbind {
                    source sourceSets.main
                }
            }
        }
        client {
            workingDirectory project.file('run')
            mods {
                qqbind {
                    source sourceSets.main
                }
            }
        }
    }
}

jarJar.enable()

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'com.google.code.gson:gson:2.10'
    annotationProcessor 'com.google.guava:guava:31.1-jre'
    annotationProcessor 'org.ow2.asm:asm-tree:9.7'
    annotationProcessor 'org.ow2.asm:asm:9.7'
    annotationProcessor 'org.ow2.asm:asm-commons:9.7'
    annotationProcessor 'org.ow2.asm:asm-util:9.7'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.7'
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    // JDBC 驱动 (MySQL Connector/J)
    minecraftLibrary 'com.mysql:mysql-connector-j:8.0.33'
    // HikariCP 连接池
    minecraftLibrary 'com.zaxxer:HikariCP:5.0.1'
    jarJar('com.mysql:mysql-connector-j:8.0.33') {
        jarJar.ranged(it, '[8.0.33,)')
    }
    jarJar('com.zaxxer:HikariCP:5.0.1') {
        jarJar.ranged(it, '[5.0.1,)')
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
            minecraft_version        : forge_minecraft_version,
            minecraft_version_range  : forge_minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : '',
            version                  : project.version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "MixinConfigs"          : "qqbind-official.mixins.json",
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar) {
    manifest { attributes('MixinConfigs': 'qqbind-official.mixins.json') }
}
