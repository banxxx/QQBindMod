plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = "${mod_version}-fabric-${fabric_minecraft_version_120}"
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../common-src/src/main/java'
            srcDir '../common-native-src/src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir '../common-native-src/src/main/resources'
        }
    }
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'qqbind-official.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.aliyun.com/repository/public' }
}

dependencies {
    // Fabric Loader
    minecraft "com.mojang:minecraft:${fabric_minecraft_version_120}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_120}"
    // Fabric API（包含我们需要的 events, command, networking 等）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_120}"
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'com.zaxxer:HikariCP:5.0.1'
//    include 'com.mysql:mysql-connector-j:8.0.33'
//    include 'com.zaxxer:HikariCP:5.0.1'
    shadow('com.mysql:mysql-connector-j:8.0.33') {
        // Classic JDBC only; X DevAPI/protobuf is unused and adds ~1.5 MB.
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    shadow 'com.zaxxer:HikariCP:5.0.1'
}

shadowJar {
    archiveClassifier = 'shadow-raw'
    configurations = [project.configurations.shadow]
    from sourceSets.main.output
    relocate 'com.mysql', 'com.poso.qqbind.libs.mysql'
    relocate 'com.zaxxer', 'com.poso.qqbind.libs.hikari'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    // 驱动类已被重定位，原始服务文件会让 ServiceLoader 找不到类。
    // 本模组显式加载驱动，排除后也不会影响自己的连接。
    exclude 'META-INF/services/java.sql.Driver'
}

remapJar {
    // 确保 remapJar 在 shadowJar 之后运行
    dependsOn shadowJar
    mustRunAfter shadowJar

    // 将 remapJar 的输入设置为 shadowJar 的输出文件
    inputFile = shadowJar.archiveFile
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)   // 1.20.1 使用 Java 17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand(
                'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_version': mod_version,
                'mod_authors': mod_authors,
                'mod_description': 'QQ绑定模组 (Fabric)',
                'minecraft_version': fabric_minecraft_version_120,
                'mod_license': mod_license
        )
    }
}

jar {
    from('src/main/java') {
        include 'com/poso/qqbind/fabric/**'
    }
    from('../common-src/src/main/java') {
        include 'com/poso/qqbind/**'
        exclude 'com/poso/qqbind/forge/**'
        exclude 'com/poso/qqbind/neoforge/**'
    }
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
